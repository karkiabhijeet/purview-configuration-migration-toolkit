name: Validate PowerShell toolkit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -MaximumVersion 5.99 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
      - name: Parse, validate manifest, and run synthetic tests
        shell: pwsh
        run: .\Tests\Invoke-Validation.ps1
